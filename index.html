<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Number Camera Scanner</title>
  <!-- Load Tesseract.js for browser OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
    }
    .preview-container {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: #1e1e1e;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #3a3a3a;
    }
    #image-preview {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      display: none;
    }
    #placeholder-text {
      color: #888;
      padding: 20px;
    }
    #controls {
      margin-top: 20px;
    }
    .camera-btn {
      display: inline-block;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
    }
    /* Hide the default file input */
    #native-camera {
      display: none;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
    #result-box {
      margin-top: 20px;
      padding: 15px;
      background: #1e1e1e;
      border-radius: 8px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .number-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    .number-item {
      padding: 12px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      color: #00d2ff;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .number-item:hover, .number-item.selected {
      background: #007bff;
      color: #ffffff;
      border-color: #007bff;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      font-size: 15px;
    }
    .call-btn {
      background: #28a745;
    }
    .whatsapp-btn {
      background: #25d366;
    }
  </style>
</head>
<body>

  <h2>Number Camera Scanner</h2>
  
  <div class="preview-container">
    <span id="placeholder-text">No photo taken yet</span>
    <img id="image-preview" alt="Captured Photo" />
  </div>

  <div id="controls">
    <!-- Hidden native file input targeting rear camera -->
    <input type="file" id="native-camera" accept="image/*" capture="environment">
    <label for="native-camera" class="camera-btn">📸 Take Clear Photo</label>
  </div>

  <p id="status">Tap the button above to open your phone's camera.</p>

  <div id="result-box">
    <h3 id="result-header">Detected Numbers:</h3>
    <div id="numbers-container">None detected yet</div>
    <div id="action-container"></div>
  </div>

  <script>
    const cameraInput = document.getElementById('native-camera');
    const imagePreview = document.getElementById('image-preview');
    const placeholderText = document.getElementById('placeholder-text');
    const statusText = document.getElementById('status');
    const numbersContainer = document.getElementById('numbers-container');
    const actionContainer = document.getElementById('action-container');

    // Process photo taken by phone camera app
    cameraInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      // Display image preview
      const imageUrl = URL.createObjectURL(file);
      imagePreview.src = imageUrl;
      imagePreview.style.display = 'block';
      placeholderText.style.display = 'none';

      statusText.innerText = "Analyzing high-res photo...";
      numbersContainer.innerHTML = "";
      actionContainer.innerHTML = "";

      try {
        // Perform OCR on high-res image
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        statusText.innerText = "Scan complete.";

        // Regex for +91 numbers or 10-digit Indian mobile numbers
        const phoneRegex = /(?:\+91[\s-]?)?[6-9]\d{9}/g;
        const matches = text.match(phoneRegex);

        if (matches && matches.length > 0) {
          // Process & Deduplicate numbers
          const uniqueNumbers = [...new Set(matches.map(num => {
            let digitsOnly = num.replace(/\D/g, '');
            return '+91' + digitsOnly.slice(-10);
          }))];

          numbersContainer.innerHTML = `<p>Select a number from below (${uniqueNumbers.length} found):</p>`;
          
          const listDiv = document.createElement('div');
          listDiv.className = 'number-list';

          uniqueNumbers.forEach((num) => {
            const item = document.createElement('div');
            item.className = 'number-item';
            item.innerText = num;
            
            item.addEventListener('click', () => {
              document.querySelectorAll('.number-item').forEach(el => el.classList.remove('selected'));
              item.classList.add('selected');
              showActions(num);
            });

            listDiv.appendChild(item);
          });

          numbersContainer.appendChild(listDiv);

        } else {
          numbersContainer.innerText = "No valid 10-digit or +91 numbers found.";
        }
      } catch (err) {
        statusText.innerText = "Error analyzing image.";
      }
    });

    // Render Action Buttons
    function showActions(formattedNumber) {
      let tenDigits = formattedNumber.slice(-10);
      let whatsappDigits = '91' + tenDigits;

      actionContainer.innerHTML = `
        <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
          <p>Action for <strong>${formattedNumber}</strong>:</p>
          <div class="btn-group">
            <a class="action-btn call-btn" href="tel:${formattedNumber}">
              📞 Call
            </a>
            <a class="action-btn whatsapp-btn" href="https://wa.me/${whatsappDigits}" target="_blank">
              💬 WhatsApp
            </a>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
